name: CI - Pruebas automatizadas

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags de Cucumber a ejecutar (ej: @smoke, @regression, @smoke or @e2e)"
        required: false
        default: "@smoke"
      browser:
        description: "Navegador"
        type: choice
        options: [ chrome, firefox ]
        default: chrome
  schedule:
    - cron: "0 12 * * 1-5" # lunes a viernes, 12:00 UTC (09:00 Argentina)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # push/PR/schedule corren @smoke; manual permite elegir tags y navegador
      TAGS: ${{ github.event.inputs.tags || '@smoke' }}
      BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar tests (headless)
        run: >
          mvn -B clean test
          -Dheadless=true
          -Dbrowser="$BROWSER"
          -Dcucumber.filter.tags="$TAGS"

      - name: Subir resultados de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Subir reporte HTML de Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports
          if-no-files-found: warn

  report:
    name: Generar reporte Allure
    needs: test
    # Se genera aunque fallen los tests, pero solo desde la rama principal
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar resultados de Allure
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Configurar Java (necesario para Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar reporte Allure
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
          ls -la allure-report

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy:
    name: Publicar en GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5